name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup update stable
          rustup default stable

      - name: Release build
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package and hash
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $name = "llamatop-v${version}-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/llamatop.exe" "dist/$name/llamatop.exe"
          Copy-Item "README.md" "dist/$name/README.md"
          Copy-Item "LICENSE" "dist/$name/LICENSE"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "dist/SHA256SUMS.txt" -Value "$hash  $name.zip" -Encoding ascii
          Get-Content "dist/SHA256SUMS.txt"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llamatop-windows
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
