name: Release

# Tagged builds only. The tag must match the version in Cargo.toml, and the
# tag is verified against the locked dependency set before anything is
# packaged or published.
on:
  push:
    tags:
      - "v*"

jobs:
  verify:
    name: Verify tag and code (stable)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag must match Cargo.toml version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if (-not $tag) { throw "tag does not start with 'v'" }
          $line = (Select-String -Path "Cargo.toml" -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($tag -ne $line) {
            throw "tag v${tag} does not match Cargo.toml version ${line}"
          }
          Write-Output "tag matches Cargo.toml version ${tag}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --all-features

  release-windows:
    name: Build and publish (Windows)
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Release build
        run: cargo build --locked --release --target x86_64-pc-windows-msvc

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/llamatop.exe"
          if (-not (Test-Path $exe)) { throw "release executable not found: $exe" }
          Write-Output "release build OK"

      - name: Package and hash
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $name = "llamatop-v${version}-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/llamatop.exe" "dist/$name/llamatop.exe"
          Copy-Item "README.md" "dist/$name/README.md"
          Copy-Item "CHANGELOG.md" "dist/$name/CHANGELOG.md"
          Copy-Item "LICENSE" "dist/$name/LICENSE"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "dist/$name.zip.sha256" -Value $hash -Encoding ascii
          Get-Content "dist/$name.zip.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llamatop-windows
          path: |
            dist/*.zip
            dist/*.sha256

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
